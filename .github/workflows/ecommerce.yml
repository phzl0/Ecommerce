name: Ecommerce checks
on:
  push:
    branches: [main, feat/checkout-gamification]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: sh mvnw -B test package
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: disposable-test-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test_user -d ecommerce_test" --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: sh mvnw -B test package
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/ecommerce_test
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: disposable-test-password
          TEST_DB_DRIVER: org.postgresql.Driver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-schema-and-tests
          path: |
            target/schema.sql
            target/surefire-reports/*.txt
