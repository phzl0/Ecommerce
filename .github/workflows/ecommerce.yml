name: Ecommerce checks
on:
  push:
    branches: [main, feat/checkout-gamification]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: sh mvnw -B test package
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: disposable-test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test_user -d ecommerce_test" --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: sh mvnw -B test package
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/ecommerce_test
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: disposable-test-password
          TEST_DB_DRIVER: org.postgresql.Driver
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - name: Install Chromium
        run: |
          sudo mkdir -p "$RUNNER_TEMP/apt-disabled"
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then sudo mv "$source" "$RUNNER_TEMP/apt-disabled/"; fi
          done
          npx playwright install --with-deps chromium
      - name: Start disposable application
        run: |
          java -jar target/ecommerce-0.0.1-SNAPSHOT.jar > /tmp/ecommerce-browser.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:8080/api/auth/me >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/ecommerce-browser.log
          exit 1
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ecommerce_test
          DB_USER: test_user
          DB_PASSWORD: disposable-test-password
          ADMIN_EMAIL: admin@example.test
          ADMIN_PASSWORD: disposable-admin-password
          DEMO_DATA_ENABLED: "true"
          APP_PAYMENTS_ENABLED: "false"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-schema-and-tests
          path: |
            test-results/
            /tmp/ecommerce-browser.log
            target/surefire-reports/*.txt
