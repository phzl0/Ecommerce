<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-container">
  <h2>Entrar na Loja</h2>

  <div th:if="${param.erro}" class="alert alert-erro">
    E-mail ou senha inválidos.
  </div>
  <div th:if="${param.logout}" class="alert alert-sucesso">
    Você saiu com sucesso.
  </div>
  <div th:if="${msg}" class="alert alert-sucesso" th:text="${msg}"></div>

  <form th:action="@{/auth/login}" method="post">
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" name="email" required placeholder="seu@email.com">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" name="senha" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-primary">Entrar</button>
  </form>

  <p>Não tem conta? <a th:href="@{/auth/cadastro}">Cadastre-se</a></p>
</div>
<div th:if="${param.sucesso}" class="alert alert-sucesso">
  Cadastro realizado com sucesso! Faça login.
</div>
</body>
</html>
