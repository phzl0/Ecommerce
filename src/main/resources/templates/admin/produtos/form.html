<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produto - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activePage='produtos')}"></div>

    <main class="admin-main">
        <header class="admin-header">
            <div>
                <a th:href="@{/admin/produtos}" class="btn-link">‹ Produtos e estoque</a>
                <h1 th:text="${produto.id == null} ? 'Novo produto' : 'Editar produto'">Produto</h1>
            </div>
            <div class="admin-actions">
                <a th:href="@{/admin/produtos}" class="admin-button secondary">Cancelar</a>
                <button type="submit" form="product-form" class="admin-button">Salvar produto</button>
            </div>
        </header>

        <p th:if="${erro}" class="alert alert-erro" role="alert" th:text="${erro}"></p>
        <form id="product-form" class="admin-product-form" th:action="@{/admin/produtos/salvar}" th:object="${produto}"
                  method="post" enctype="multipart/form-data"><div class="form-group"><label for="tipo">Tipo de produto</label><select th:field="*{tipo}"><option value="FISICO">Físico</option><option value="DIGITAL">Digital</option></select></div>

                <input type="hidden" th:field="*{id}">
                <input type="hidden" name="estoqueOriginal" th:value="${estoqueOriginal}">
                <section class="form-card admin-editor-description" aria-labelledby="product-info">
                <h2 id="product-info">Informações do produto</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome *</label>
                        <input type="text" th:field="*{nome}" placeholder="Nome do produto">
                        <span class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                    </div>
                    <div class="form-group">
                        <label for="sku">SKU</label>
                        <input type="text" th:field="*{sku}" placeholder="Gerado automaticamente se vazio">
                        <span class="erro" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="marca">Marca</label>
                        <input type="text" th:field="*{marca}" placeholder="Marca ou linha">
                        <span class="erro" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></span>
                    </div>
                    <div class="form-group">
                        <label for="categoriaId">Categoria</label>
                        <select name="categoriaId" id="categoriaId">
                            <option value="">Sem categoria</option>
                            <option th:each="cat : ${categorias}"
                                    th:value="${cat.id}"
                                    th:text="${cat.nome}"
                                    th:selected="${produto.categoria != null and produto.categoria.id == cat.id}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="descricaoCurta">Descrição curta</label>
                    <input type="text" th:field="*{descricaoCurta}"
                           placeholder="Frase curta para cards e vitrines">
                    <span class="erro" th:if="${#fields.hasErrors('descricaoCurta')}" th:errors="*{descricaoCurta}"></span>
                </div>

                <div class="form-group checkbox-inline">
                    <label>
                        <input type="checkbox" th:field="*{destaque}">
                        Exibir como destaque na home
                    </label>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea th:field="*{descricao}" rows="5"
                              placeholder="Descreva o produto com mais detalhes"></textarea>
                </div>

                </section>
                <div class="admin-editor-side">
                <section class="form-card" aria-labelledby="product-price">
                <h2 id="product-price">Preço e estoque</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="preco">Preço *</label>
                        <input type="number" th:field="*{preco}" step="0.01" min="0.01" placeholder="0,00">
                        <span class="erro" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></span>
                    </div>
                    <div class="form-group">
                        <label for="estoque">Estoque *</label>
                        <input type="number" th:field="*{estoque}" min="0" placeholder="0">
                        <span class="erro" th:if="${#fields.hasErrors('estoque')}" th:errors="*{estoque}"></span>
                    </div>
                </div>

                </section>
                <section class="form-card" aria-labelledby="product-image">
                <h2 id="product-image">Imagem</h2>
                <div class="admin-media-preview" th:if="${produto.imagemUrl != null}">
                    <img th:src="${produto.imagemUrl}" width="64" height="64" alt="Imagem atual">
                    <span>Imagem atual</span>
                </div>
                <div class="form-group">
                    <label for="imagem">Imagem do produto</label>
                    <input type="file" name="imagem" id="imagem" accept="image/jpeg,image/png" aria-describedby="product-image-help">
                    <small id="product-image-help" class="table-subtext">JPG ou PNG, até 5 MB.</small>
                </div>
                </section>
                </div>
        </form>
    </main>
</div>
</body>
</html>
