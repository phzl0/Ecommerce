<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar}" th:with="activePage='dashboard'"></div>

    <main class="admin-main">
        <div class="admin-header">
            <div>
                <h1>Visão operacional</h1>
                <p class="admin-subtitle">Indicadores centrais para acompanhar catálogo, pedidos e receita.</p>
            </div>
        </div>

        <div th:if="${msg}" class="alert alert-sucesso" th:text="${msg}"></div>

        <div class="metrics-grid">
            <div class="metric-card">
                <p class="metric-label">Sem estoque</p>
                <p class="metric-value" th:text="${produtosSemEstoque}">0</p>
            </div>
            <div class="metric-card">
                <p class="metric-label">Pedidos pendentes</p>
                <p class="metric-value" th:text="${pedidosPendentes}">0</p>
            </div>
            <div class="metric-card">
                <p class="metric-label">Total de pedidos</p>
                <p class="metric-value" th:text="${totalPedidos}">0</p>
            </div>
            <div class="metric-card">
                <p class="metric-label">Produtos ativos</p>
                <p class="metric-value" th:text="${totalProdutos}">0</p>
            </div>
            <div class="metric-card">
                <p class="metric-label">Clientes</p>
                <p class="metric-value" th:text="${totalClientes}">0</p>
            </div>
            <div class="metric-card destaque">
                <p class="metric-label">Receita total</p>
                <p class="metric-value"
                   th:text="'R$ ' + ${#numbers.formatDecimal(receitaTotal, 1, 'POINT', 2, 'COMMA')}">
                    R$ 0,00
                </p>
            </div>
        </div>

        <div class="admin-section">
            <h2>Pedidos recentes</h2>
            <table class="admin-table">
                <thead>
                <tr>
                    <th>Pedido</th>
                    <th>Cliente</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Data</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="pedido : ${pedidosRecentes}">
                    <td th:text="${pedido.numero != null ? pedido.numero : '#' + pedido.id}"></td>
                    <td th:text="${pedido.usuario.nome}"></td>
                    <td th:text="'R$ ' + ${#numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td>
                        <span class="status-badge"
                              th:text="${pedido.status}"
                              th:classappend="'status-' + ${pedido.status.name().toLowerCase()}">
                        </span>
                    </td>
                    <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <a th:href="@{/admin/pedidos/{id}(id=${pedido.id})}" class="btn-link">
                            Abrir
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
