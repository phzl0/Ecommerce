<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(activePage)" class="admin-sidebar">
  <a class="sidebar-brand" th:href="@{/admin}">
    <span class="sidebar-logo" aria-hidden="true">L.</span>
    <span><strong>LEVEL COMMERCE</strong><small>Administração</small></span>
  </a>
  <details class="admin-navigation" open><summary>Menu da administração</summary>
  <nav class="sidebar-nav" aria-label="Administração da loja">
    <div class="sidebar-group">
      <span>Operação</span>
      <a th:href="@{/admin}" th:attr="aria-current=${activePage == 'dashboard' ? 'page' : null}">Visão geral</a>
      <a th:href="@{/admin/pedidos}" th:attr="aria-current=${activePage == 'pedidos' ? 'page' : null}">Pedidos</a>
    </div>
    <div class="sidebar-group">
      <span>Catálogo</span>
      <a th:href="@{/admin/produtos}" th:attr="aria-current=${activePage == 'produtos' ? 'page' : null}">Produtos e estoque</a>
      <a th:href="@{/admin/categorias}" th:attr="aria-current=${activePage == 'categorias' ? 'page' : null}">Categorias</a>
    </div>
    <div class="sidebar-group">
      <span>Engajamento</span>
      <a th:href="@{/admin/fidelidade}" th:attr="aria-current=${activePage == 'fidelidade' ? 'page' : null}">Passe, VIP e Baú</a>
      <a th:href="@{/admin/eventos}" th:attr="aria-current=${activePage == 'eventos' ? 'page' : null}">Eventos</a>
    </div>
    <div class="sidebar-group">
      <span>Configuração</span>
      <a th:href="@{/admin/integracoes}" th:attr="aria-current=${activePage == 'integracoes' ? 'page' : null}">Integrações</a>
    </div>
    <div class="sidebar-group sidebar-footer">
      <a th:href="@{/}">Voltar à loja</a>
      <form th:action="@{/auth/logout}" method="post" class="sidebar-logout">
        <button type="submit">Encerrar sessão</button>
      </form>
    </div>

</nav></details>
</aside>
</body>
</html>
