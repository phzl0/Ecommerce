<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Separação e envios | LEVEL</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css"><script src="/js/admin.js" defer></script></head>
<body class="admin-body"><div class="admin-layout"><div th:replace="~{admin/fragments/sidebar :: sidebar(activePage='expedicao')}"></div><main class="admin-main">
<header class="admin-header"><div><span class="admin-eyebrow">OPERAÇÃO</span><h1>Separação e envios</h1><p class="admin-subtitle">Compras e prêmios físicos no mesmo fluxo. Pedidos mais antigos aparecem primeiro.</p></div></header>
<form class="admin-filter" method="get"><label for="shipping-stage">Etapa</label><select id="shipping-stage" name="etapa"><option value="" th:selected="${etapa == ''}">Todas</option><option value="NA_FILA" th:selected="${etapa == 'NA_FILA'}">Aguardando separação</option><option value="SEPARANDO" th:selected="${etapa == 'SEPARANDO'}">Em separação</option><option value="CONFERIDO" th:selected="${etapa == 'CONFERIDO'}">Conferidos</option><option value="ENVIADO" th:selected="${etapa == 'ENVIADO'}">Enviados</option><option value="ENTREGUE" th:selected="${etapa == 'ENTREGUE'}">Entregues</option></select><button class="admin-button">Filtrar</button></form>
<div class="admin-table-wrap" role="region" aria-label="Fila de envios" tabindex="0"><table class="admin-table"><thead><tr><th>Pedido</th><th>Cliente</th><th>Origem</th><th>Data</th><th>Etapa</th><th>Ação</th></tr></thead><tbody><tr th:each="f : ${fila}"><td th:text="${f.pedido.numero}"></td><td th:text="${f.pedido.usuario.nome}"></td><td th:text="${f.pedido.recompensa ? 'Baú' : 'Compra'}"></td><td th:text="${#temporals.format(f.pedido.dataPedido,'dd/MM/yyyy HH:mm')}"></td><td th:text="${f.etapa}"></td><td><a class="btn-link" th:href="@{/admin/pedidos/{id}(id=${f.pedido.id})}">Preparar pedido</a></td></tr><tr th:if="${fila.empty}"><td colspan="6" class="admin-empty">Nenhum pedido nesta etapa.</td></tr></tbody></table></div>
<nav class="admin-pagination" aria-label="Paginação"><a th:if="${pagina.hasPrevious()}" th:href="@{/admin/expedicao(etapa=${etapa},pagina=${pagina.number-1})}">Anterior</a><span th:text="${'Página ' + (pagina.number+1)}"></span><a th:if="${pagina.hasNext()}" th:href="@{/admin/expedicao(etapa=${etapa},pagina=${pagina.number+1})}">Próxima</a></nav>
</main></div></body></html>
