<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reembolsos | LEVEL</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css"><script src="/js/admin.js" defer></script></head><body class="admin-body"><div class="admin-layout"><div th:replace="~{admin/fragments/sidebar :: sidebar(activePage='reembolsos')}"></div><main class="admin-main"><header class="admin-header"><div><span class="admin-eyebrow">PÓS-VENDA</span><h1>Reembolsos e benefícios</h1><p>Solicitações financeiras e benefícios que exigem análise.</p></div></header>
<form class="admin-filter"><label for="refund-state">Estado</label><select name="estado" id="refund-state"><option value="">Todos</option><option th:each="s : ${ {'PENDENTE','CONFIRMADO','CANCELADO'} }" th:value="${s}" th:selected="${estado==s}" th:text="${s}"></option></select><label class="admin-check"><input type="checkbox" name="analise" value="true" th:checked="${analise}">Somente benefícios pendentes</label><button class="admin-button">Filtrar</button></form>
<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Reembolso</th><th>Pedido</th><th>Valor</th><th>Estado</th><th>Benefícios</th><th>Ação</th></tr></thead><tbody><tr th:each="r : ${pagina.content}"><td th:text="${r.id}"></td><td th:text="${r.pedidoId}"></td><td th:text="${'R$ ' + r.valor}"></td><td th:text="${r.estado}"></td><td th:text="${r.analiseBeneficios ? (r.analisadoEm == null ? 'Análise pendente' : 'Análise registrada') : 'Sem pendência'}"></td><td><a th:href="@{/admin/pedidos/{id}(id=${r.pedidoId})}">Ver pedido</a></td></tr><tr th:if="${pagina.empty}"><td colspan="6">Nenhum reembolso neste filtro.</td></tr></tbody></table></div>
<nav class="admin-pagination"><a th:if="${pagina.hasPrevious()}" th:href="@{/admin/reembolsos(estado=${estado},analise=${analise},pagina=${pagina.number-1})}">Anterior</a><span th:text="${'Página ' + (pagina.number+1)}"></span><a th:if="${pagina.hasNext()}" th:href="@{/admin/reembolsos(estado=${estado},analise=${analise},pagina=${pagina.number+1})}">Próxima</a></nav></main></div></body></html>
