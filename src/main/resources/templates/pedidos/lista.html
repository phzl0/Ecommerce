<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>...</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" style="margin-top:2rem;">
    <h2>Meus pedidos</h2>

    <p th:if="${pedidos.isEmpty()}" class="sem-resultados">Você ainda não fez nenhum pedido.</p>

    <div th:if="${!pedidos.isEmpty()}" class="pedidos-lista">
        <div th:each="pedido : ${pedidos}" class="pedido-card">
            <div class="pedido-header">
                <span>Pedido <strong th:text="'#' + ${pedido.id}"></strong></span>
                <span class="status-badge"
                      th:text="${pedido.status}"
                      th:classappend="'status-' + ${pedido.status.name().toLowerCase()}"></span>
                <span th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"
                      class="pedido-data"></span>
            </div>
            <div class="pedido-body">
                <span th:text="${pedido.itens.size()} + ' item(ns)'" class="pedido-itens"></span>
                <strong th:text="'R$ ' + ${#numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'COMMA')}"
                        class="pedido-total"></strong>
                <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn-ver">Ver detalhes →</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
