<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" style="margin-top:2rem;">
    <h2>Finalizar pedido</h2>

    <div th:if="${erro}" class="alert alert-erro" th:text="${erro}"></div>

    <div class="checkout-layout">
        <form th:action="@{/carrinho/checkout}" th:object="${checkoutForm}" method="post" class="checkout-form">
            <h3>Dados de entrega</h3>

            <div class="form-row two-col">
                <div class="form-group">
                    <label>Nome do destinatario</label>
                    <input type="text" th:field="*{nomeDestinatario}" placeholder="Quem vai receber o pedido">
                    <span class="erro" th:errors="*{nomeDestinatario}"></span>
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" th:field="*{telefoneContato}" placeholder="(00) 00000-0000">
                    <span class="erro" th:errors="*{telefoneContato}"></span>
                </div>
            </div>

            <div class="form-row cep-grid">
                <div class="form-group">
                    <label>CEP</label>
                    <div class="cep-row">
                        <input type="text" id="cep" th:field="*{cep}" placeholder="00000-000"
                               maxlength="9" oninput="mascaraCep(this)">
                        <button type="button" class="btn-cep"
                                onclick="buscarCep()">Buscar</button>
                    </div>
                    <span class="erro" th:errors="*{cep}"></span>
                    <span id="cep-feedback" class="cep-feedback"></span>
                </div>
                <div class="form-group">
                    <label>Endereco</label>
                    <input type="text" id="logradouro" th:field="*{logradouro}" placeholder="Rua, avenida, travessa">
                    <span class="erro" th:errors="*{logradouro}"></span>
                </div>
            </div>

            <div class="form-row three-col">
                <div class="form-group">
                    <label>Numero</label>
                    <input type="text" th:field="*{numero}" placeholder="123">
                    <span class="erro" th:errors="*{numero}"></span>
                </div>
                <div class="form-group">
                    <label>Complemento</label>
                    <input type="text" id="complemento" th:field="*{complemento}" placeholder="Apto, bloco, referencia">
                    <span class="erro" th:errors="*{complemento}"></span>
                </div>
                <div class="form-group">
                    <label>Bairro</label>
                    <input type="text" id="bairro" th:field="*{bairro}" placeholder="Seu bairro">
                    <span class="erro" th:errors="*{bairro}"></span>
                </div>
            </div>

            <div class="form-row two-col">
                <div class="form-group">
                    <label>Cidade</label>
                    <input type="text" id="cidade" th:field="*{cidade}" placeholder="Sua cidade">
                    <span class="erro" th:errors="*{cidade}"></span>
                </div>
                <div class="form-group">
                    <label>UF</label>
                    <input type="text" id="uf" th:field="*{uf}" maxlength="2" placeholder="SP">
                    <span class="erro" th:errors="*{uf}"></span>
                </div>
            </div>

            <div class="form-group">
                <label>Observacoes do pedido</label>
                <textarea th:field="*{observacoes}" rows="4"
                          placeholder="Ponto de referencia, horario preferido ou instrucoes de entrega"></textarea>
                <span class="erro" th:errors="*{observacoes}"></span>
            </div>

            <button type="submit" class="btn btn-primary">
                Confirmar pedido
            </button>
        </form>

        <aside class="carrinho-resumo">
            <h3>Seu pedido</h3>
            <div th:each="item : ${itens}" class="resumo-item">
                <span th:text="${item.nome + ' x ' + item.quantidade}"></span>
                <span th:text="'R$ ' + ${#numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}"></span>
            </div>
            <hr style="margin:12px 0;">
            <div class="resumo-linha">
                <span>Subtotal</span>
                <strong th:text="'R$ ' + ${#numbers.formatDecimal(subtotal, 1, 'POINT', 2, 'COMMA')}"></strong>
            </div>
            <div class="resumo-linha">
                <span>Frete</span>
                <strong th:text="${frete.compareTo(T(java.math.BigDecimal).ZERO) == 0 ? 'Gratis' : 'R$ ' + #numbers.formatDecimal(frete, 1, 'POINT', 2, 'COMMA')}"></strong>
            </div>
            <div class="resumo-total">
                <span>Total</span>
                <strong th:text="'R$ ' + ${#numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA')}"></strong>
            </div>
        </aside>
    </div>
</div>

<script>
    function mascaraCep(input) {
        let v = input.value.replace(/\D/g, '');
        if (v.length > 5) v = v.slice(0, 5) + '-' + v.slice(5, 8);
        input.value = v;
    }

    function buscarCep() {
        const cep = document.getElementById('cep').value.replace(/\D/g, '');
        const feedback = document.getElementById('cep-feedback');

        if (cep.length !== 8) {
            feedback.textContent = 'CEP invalido.';
            feedback.style.color = '#e74c3c';
            return;
        }

        feedback.textContent = 'Buscando...';
        feedback.style.color = '#999';

        fetch(`/api/cep/${cep}`)
            .then(r => r.json())
            .then(data => {
                if (data.erro) {
                    feedback.textContent = 'CEP nao encontrado.';
                    feedback.style.color = '#e74c3c';
                    return;
                }
                document.getElementById('logradouro').value = data.logradouro || '';
                document.getElementById('bairro').value = data.bairro || '';
                document.getElementById('cidade').value = data.localidade || '';
                document.getElementById('uf').value = data.uf || '';
                if (data.complemento) {
                    document.getElementById('complemento').value = data.complemento;
                }
                feedback.textContent = 'Endereco encontrado.';
                feedback.style.color = '#27ae60';
            })
            .catch(() => {
                feedback.textContent = 'Erro ao buscar CEP.';
                feedback.style.color = '#e74c3c';
            });
    }
</script>
</body>
</html>
